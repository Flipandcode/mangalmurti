<head>
<meta charset="UTF-8">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
:root{
  --bg:#f4f6f4;
  --surface:#ffffff;
  --surface-soft:#f8faf8;
  --ink:#1d2821;
  --muted:#728078;
  --line:#e4e9e5;
  --accent:#236343;
  --accent-dark:#17472f;
  --accent-soft:#e8f4ec;
  --orange:#e96b25;
  --orange-soft:#fff0e7;
  --danger:#c63d3d;
  --danger-soft:#fff0f0;
  --shadow:0 10px 30px rgba(31,55,42,.08);
  --shadow-sm:0 4px 14px rgba(31,55,42,.06);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top left, rgba(47,111,79,.08), transparent 28%),
    linear-gradient(180deg,#f8faf8 0%,var(--bg) 100%);
  color:var(--ink);
  font-family:'Noto Sans Devanagari','Poppins',Arial,sans-serif;
  padding:28px;
}

.app-shell{
  width:100%;
  max-width:1180px;
  margin:0 auto;
}

/* ================= HEADER ================= */

.hero{
  background:linear-gradient(135deg,#1d5138 0%,#2f6f4f 55%,#3c8a61 100%);
  border-radius:24px;
  padding:30px;
  color:#fff;
  position:relative;
  overflow:hidden;
  box-shadow:0 16px 40px rgba(25,76,50,.18);
}

.hero::before{
  content:"";
  position:absolute;
  width:260px;
  height:260px;
  border-radius:50%;
  background:rgba(255,255,255,.07);
  top:-120px;
  right:-70px;
}

.hero::after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  border:28px solid rgba(255,255,255,.05);
  bottom:-110px;
  left:35%;
}

.hero-content{
  position:relative;
  z-index:1;
}

.top-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:24px;
}

.brand{
  display:flex;
  gap:16px;
  align-items:flex-start;
}

.brand-icon{
  width:54px;
  height:54px;
  flex-shrink:0;
  border-radius:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(8px);
}

h1{
  margin:0;
  font-size:28px;
  font-weight:800;
  letter-spacing:.2px;
}

.sub{
  margin-top:6px;
  font-size:13px;
  color:rgba(255,255,255,.78);
  line-height:1.6;
}

.conn-ok{
  color:#c8ffd8;
  font-weight:600;
}

.conn-bad{
  color:#ffd0c8;
  font-weight:600;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.save-indicator{
  font-size:12px;
  font-weight:700;
  color:#d9ffe5;
  opacity:0;
  transform:translateY(4px);
  transition:all .25s ease;
  white-space:nowrap;
}

.save-indicator.show{
  opacity:1;
  transform:translateY(0);
}

.action-btn{
  border:none;
  color:#fff;
  padding:11px 15px;
  border-radius:12px;
  font-family:inherit;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
  display:flex;
  align-items:center;
  gap:7px;
}

.action-btn:hover{
  transform:translateY(-1px);
}

.action-btn:active{
  transform:translateY(0);
}

.poster-btn{
  background:linear-gradient(135deg,#e86d25,#d85616);
  box-shadow:0 8px 18px rgba(180,70,15,.22);
}

.poster-btn:hover{
  background:linear-gradient(135deg,#d85f1d,#c84a10);
}

.export-btn{
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.18);
}

.export-btn:hover{
  background:rgba(255,255,255,.22);
}

.action-btn:disabled{
  opacity:.65;
  cursor:not-allowed;
  transform:none;
}

/* ================= SEARCH ================= */

.search-card{
  margin-top:22px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:10px;
  box-shadow:var(--shadow-sm);
  display:flex;
  align-items:center;
  gap:10px;
}

.search-icon{
  width:42px;
  height:42px;
  border-radius:12px;
  background:var(--accent-soft);
  color:var(--accent);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  flex-shrink:0;
}

.search-input{
  border:none;
  outline:none;
  width:100%;
  padding:10px 4px;
  font-family:inherit;
  font-size:14px;
  color:var(--ink);
  background:transparent;
}

.search-input::placeholder{
  color:#9aa49e;
}

.clear-search{
  border:none;
  background:var(--surface-soft);
  color:var(--muted);
  width:34px;
  height:34px;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
  display:none;
  align-items:center;
  justify-content:center;
}

.clear-search.show{
  display:flex;
}

.clear-search:hover{
  background:var(--danger-soft);
  color:var(--danger);
}

/* ================= STATS ================= */

.stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin:20px 0;
}

.stat-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px 18px;
  box-shadow:var(--shadow-sm);
}

.stat-label{
  color:var(--muted);
  font-size:12px;
  font-weight:600;
}

.stat-value{
  margin-top:4px;
  font-size:25px;
  font-family:'Poppins',sans-serif;
  font-weight:800;
  color:var(--accent-dark);
}

/* ================= TABS ================= */

.tabs-wrap{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:8px;
  box-shadow:var(--shadow-sm);
  margin-bottom:16px;
}

.tabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab-btn{
  border:none;
  background:transparent;
  color:var(--muted);
  padding:10px 16px;
  border-radius:12px;
  font-family:inherit;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
  transition:all .18s ease;
  flex-shrink:0;
}

.tab-btn:hover{
  background:var(--surface-soft);
  color:var(--accent);
}

.tab-btn.active{
  background:var(--accent);
  color:#fff;
  box-shadow:0 5px 12px rgba(35,99,67,.18);
}

.count{
  font-family:'Poppins',sans-serif;
  font-size:11px;
  opacity:.8;
  margin-left:4px;
}

/* ================= CONTENT ================= */

.content-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.list-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:19px 20px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#ffffff,#fbfcfb);
}

.list-title{
  font-size:16px;
  font-weight:800;
}

.list-subtitle{
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
}

.result-count{
  background:var(--accent-soft);
  color:var(--accent);
  padding:7px 11px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
}

.list{
  overflow:hidden;
}

.row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 18px;
  border-bottom:1px solid var(--line);
  transition:background .15s ease;
}

.row:last-child{
  border-bottom:none;
}

.row:hover{
  background:#fbfdfb;
}

.member-avatar{
  width:40px;
  height:40px;
  border-radius:13px;
  background:linear-gradient(135deg,#e8f4ec,#d6ebdd);
  color:var(--accent);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Poppins',sans-serif;
  font-weight:800;
  font-size:13px;
  flex-shrink:0;
}

.name{
  flex:1;
  min-width:0;
  font-size:14px;
  font-weight:700;
  word-break:break-word;
}

.member-meta{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:6px;
  margin-top:4px;
}

.badge{
  font-size:10px;
  background:var(--accent-soft);
  color:var(--accent);
  padding:3px 8px;
  border-radius:999px;
  font-weight:700;
}

.badge-room{
  font-size:10px;
  background:#f1f3f2;
  color:#657169;
  padding:3px 8px;
  border-radius:999px;
  font-weight:700;
}

.select-wrap{
  display:flex;
  align-items:center;
  gap:7px;
  flex-shrink:0;
}

select,
.room-input{
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink);
  border-radius:10px;
  font-family:inherit;
  font-size:12px;
  outline:none;
  transition:border .15s ease,box-shadow .15s ease;
}

select{
  padding:9px 9px;
  cursor:pointer;
}

.room-input{
  width:74px;
  padding:9px 7px;
  text-align:center;
}

select:focus,
.room-input:focus,
.name-input:focus,
.add-row input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(47,111,79,.10);
}

.room-input::placeholder{
  color:#b0b9b3;
}

.icon-btn{
  border:1px solid var(--line);
  background:#fff;
  color:var(--muted);
  width:36px;
  height:36px;
  border-radius:10px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  transition:all .15s ease;
  flex-shrink:0;
}

.icon-btn:hover{
  color:var(--accent);
  background:var(--accent-soft);
  border-color:#b8d7c3;
}

.icon-btn.danger:hover{
  color:var(--danger);
  background:var(--danger-soft);
  border-color:#f0bebe;
}

.name-input{
  flex:1;
  min-width:0;
  border:1px solid var(--accent);
  border-radius:10px;
  padding:10px;
  font-family:inherit;
  font-size:14px;
  outline:none;
}

/* ================= EMPTY ================= */

.empty{
  padding:55px 25px;
  text-align:center;
  color:var(--muted);
}

.empty-icon{
  width:58px;
  height:58px;
  margin:0 auto 12px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--surface-soft);
  font-size:27px;
}

.empty-title{
  font-size:15px;
  font-weight:800;
  color:var(--ink);
}

.empty-sub{
  margin-top:5px;
  font-size:12px;
}

/* ================= ADD MEMBER ================= */

.add-row{
  display:flex;
  gap:10px;
  padding:16px 18px;
  background:linear-gradient(180deg,#fbfcfb,#f6f9f7);
  border-top:1px solid var(--line);
}

.add-row input{
  flex:1;
  min-width:0;
  border:1px solid var(--line);
  background:#fff;
  color:var(--ink);
  border-radius:11px;
  padding:11px 13px;
  font-family:inherit;
  font-size:13px;
  outline:none;
}

.add-btn{
  border:none;
  background:var(--accent);
  color:#fff;
  padding:0 18px;
  border-radius:11px;
  font-family:inherit;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
  transition:background .15s ease,transform .15s ease;
}

.add-btn:hover{
  background:var(--accent-dark);
  transform:translateY(-1px);
}

/* ================= COMMITTEE ================= */

.committee-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 18px;
  border-bottom:1px solid var(--line);
}

.committee-row:last-child{
  border-bottom:none;
}

.committee-avatar{
  width:42px;
  height:42px;
  border-radius:13px;
  background:linear-gradient(135deg,#fff1d9,#ffe0ad);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  flex-shrink:0;
}

.committee-name{
  flex:1;
  font-size:14px;
  font-weight:700;
}

.committee-role{
  padding:6px 10px;
  border-radius:999px;
  background:#fff4df;
  color:#a65d00;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}

/* ================= MOBILE ================= */

@media(max-width:760px){

  body{
    padding:12px;
  }

  .hero{
    border-radius:20px;
    padding:20px;
  }

  .top-row{
    flex-direction:column;
    gap:18px;
  }

  .brand{
    gap:12px;
  }

  .brand-icon{
    width:48px;
    height:48px;
    border-radius:15px;
  }

  h1{
    font-size:21px;
  }

  .sub{
    font-size:11.5px;
  }

  .header-actions{
    width:100%;
    justify-content:stretch;
  }

  .save-indicator{
    width:100%;
    order:-1;
  }

  .action-btn{
    flex:1;
    justify-content:center;
    padding:11px 8px;
    font-size:11px;
  }

  .stats-grid{
    gap:8px;
    margin:14px 0;
  }

  .stat-card{
    border-radius:14px;
    padding:12px;
  }

  .stat-label{
    font-size:10px;
  }

  .stat-value{
    font-size:20px;
  }

  .tabs-wrap{
    border-radius:15px;
  }

  .tab-btn{
    padding:9px 13px;
    font-size:12px;
  }

  .content-card{
    border-radius:18px;
  }

  .list-header{
    padding:16px;
  }

  .row{
    padding:13px;
    flex-wrap:wrap;
  }

  .member-avatar{
    width:38px;
    height:38px;
  }

  .name{
    width:calc(100% - 52px);
    flex:none;
  }

  .select-wrap{
    width:100%;
    padding-left:50px;
  }

  select{
    flex:1;
    min-width:0;
    padding:10px 8px;
  }

  .room-input{
    width:78px;
    padding:10px 5px;
  }

  .icon-btn{
    width:38px;
    height:38px;
  }

  .row > .icon-btn{
    margin-top:-46px;
  }

  .row > .select-wrap + .icon-btn{
    margin-left:auto;
  }

  .add-row{
    flex-direction:column;
    padding:14px;
  }

  .add-row input{
    padding:12px;
  }

  .add-btn{
    height:44px;
    width:100%;
  }

  .committee-row{
    padding:13px;
  }

  .committee-name{
    font-size:13px;
  }

  .committee-role{
    font-size:9px;
  }
}
</style>

</head>

  if(
    !SUPABASE_URL.startsWith("http") ||
    SUPABASE_ANON_KEY === "YOUR_SUPABASE_ANON_KEY"
  ){
    setConnStatus(false,"⚠ Supabase कॉन्फ़िगर नहीं है");
    render();
    return;
  }

  if(typeof window.supabase === "undefined"){
    setConnStatus(false,"⚠ Supabase लाइब्रेरी लोड नहीं हो पाई");
    render();
    return;
  }

  try{

    sb = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

  }catch(e){

    console.error(e);

    setConnStatus(
      false,
      "⚠ कनेक्शन शुरू नहीं हो सका"
    );

    render();
    return;
  }

  await loadMembers();

  try{
    subscribeRealtime();
  }catch(e){
    console.error("Realtime subscribe failed",e);
  }
}


/* ================= LOAD MEMBERS ================= */

async function loadMembers(){

  try{

    const {data,error} = await sb
      .from("galli_members")
      .select("id,name,galli,room_no")
      .order("created_at",{ascending:true});

    if(error) throw error;

    MEMBERS = data || [];

    setConnStatus(true,"● लाइव सिंक चालू");

  }catch(e){

    console.error(e);

    setConnStatus(
      false,
      "⚠ डेटा लोड नहीं हो सका"
    );

  }

  render();
}


/* ================= REALTIME ================= */

function subscribeRealtime(){

  sb
    .channel("galli_members_changes")

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"galli_members"
      },
      ()=>{
        loadMembers();
      }
    )

    .subscribe();
}

/* ================= COUNTS ================= */

function countFor(tabId){

  if(tabId === "all"){
    return MEMBERS.length;
  }

  if(tabId === "unassigned"){
    return MEMBERS.filter(m=>!m.galli).length;
  }

  if(tabId === "committee"){
    return COMMITTEE.length;
  }

  return MEMBERS.filter(
    m=>m.galli === tabId
  ).length;
}

function renderTabs(){

  tabsEl.innerHTML = "";

  TABS.forEach(t=>{

    const btn = document.createElement("button");

    btn.className =
      "tab-btn" +
      (currentTab === t.id ? " active" : "");

    btn.innerHTML =
      `${t.label}<span class="count">(${countFor(t.id)})</span>`;

    btn.onclick = ()=>{

        except search itself always moves to सर्व.
      */

      currentTab = t.id;

      const searchInput =
        document.getElementById("searchInput");

      searchInput.value = "";

      updateSearchUI();

/* ================= SORT ================= */

function sortByRoom(members){

  return [...members].sort((a,b)=>{

    const ra =
      (a.room_no || "").toString().trim();

    const rb =
      (b.room_no || "").toString().trim();

    if(!ra && !rb) return 0;

    if(!ra) return 1;

    if(!rb) return -1;

    const na = parseFloat(ra);
    const nb = parseFloat(rb);

    if(
      !isNaN(na) &&
      !isNaN(nb) &&
      na !== nb
    ){
      return na - nb;
    }

    return ra.localeCompare(
      rb,
      "hi",
      {numeric:true}
    );

  });

}


/* ================= FILTER MEMBERS ================= */

function getCurrentMembers(){

  /*
    Search ALWAYS searches all members
    because currentTab becomes "all"
  */

  if(searchQuery){

    const query = searchQuery.toLowerCase();

    return MEMBERS.filter(member=>
      member.name.toLowerCase().includes(query)
    );

  }

  let members;

  if(currentTab === "all"){

    members = [...MEMBERS];

  }else if(currentTab === "unassigned"){

    members = MEMBERS.filter(m=>!m.galli);

  }else{

    members = MEMBERS.filter(
      m=>m.galli === currentTab
    );

    if(["1","2","3","4"].includes(currentTab)){
      members = sortByRoom(members);
    }

  }

  return members;

}


/* ================= LIST HEADER ================= */

function updateListHeader(count){

    document.getElementById("listTitle");

  const subtitle =
    document.getElementById("listSubtitle");

  const resultCount =
    document.getElementById("resultCount");

  if(currentTab === "committee"){

      "पदाधिकारी आणि सदस्यांची सूची";

  }else if(searchQuery){

      "खोज परिणाम";

    subtitle.textContent =
      `"${searchQuery}" के लिए सभी सदस्यों में खोज`;

  }else{

    const tab =
      TABS.find(t=>t.id === currentTab);

    title.textContent =
      tab ? tab.label : "सदस्य सूची";

    subtitle.textContent =
      "सदस्य व्यवस्थापन";

  }

  resultCount.textContent =
    `${count} सदस्य`;

}


/* ================= AVATAR ================= */

function getInitials(name){

  if(!name) return "?";

  const parts = name.trim().split(/\s+/);

  if(parts.length === 1){
    return parts[0].slice(0,1);
  }

  return (
    parts[0].slice(0,1) +
    parts[1].slice(0,1)
  );

}


/* ================= RENDER LIST ================= */

function renderList(){

  const listEl =
    document.getElementById("list");

  listEl.innerHTML = "";


  /* ===== COMMITTEE ===== */

  if(currentTab === "committee"){

    updateListHeader(COMMITTEE.length);

    COMMITTEE.forEach(person=>{

      const row =
        document.createElement("div");

      row.className =
        "committee-row";

      const avatar =
        document.createElement("div");

      avatar.className =
        "committee-avatar";

      avatar.textContent = "👤";

      const name =
        document.createElement("div");

      name.className =
        "committee-name";

      name.textContent =
        person.name;

      const role =
        document.createElement("div");

      role.className =
        "committee-role";

      role.textContent =
        person.role;

      row.appendChild(avatar);
      row.appendChild(name);
      row.appendChild(role);

      listEl.appendChild(row);

    });

    return;
  }


  /* ===== MEMBERS ===== */

  const members =
    getCurrentMembers();

  updateListHeader(members.length);


  if(members.length === 0){

    const empty =
      document.createElement("div");

    empty.className =
      "empty";

    empty.innerHTML = `
      <div class="empty-icon">👥</div>
      <div class="empty-title">कोई सदस्य नहीं मिला</div>
      <div class="empty-sub">
        ${
          searchQuery
            ? "कृपया दूसरा नाम खोजें"
            : "इस सूची में अभी कोई सदस्य नहीं है"
        }
      </div>
    `;

    listEl.appendChild(empty);

  }


  members.forEach(member=>{

    const row =
      document.createElement("div");

    row.className = "row";


    /* ===== EDIT MODE ===== */

    if(editingId === member.id){

      const avatar =
        document.createElement("div");

      avatar.className =
        "member-avatar";

      avatar.textContent =
        getInitials(member.name);


      const input =
        document.createElement("input");

      input.className =
        "name-input";

      input.value =
        member.name;


      const saveBtn =
        document.createElement("button");

      saveBtn.className =
        "icon-btn";

      saveBtn.title =
        "सेव करें";

      saveBtn.textContent =
        "✓";

      saveBtn.onclick =
        ()=>commitEdit(
          member,
          input.value
        );


      const cancelBtn =
        document.createElement("button");

      cancelBtn.className =
        "icon-btn";

      cancelBtn.title =
        "रद्द करें";

      cancelBtn.textContent =
        "✕";

      cancelBtn.onclick =
        ()=>{
          editingId = null;
          render();
        };


      input.onkeydown =
        (e)=>{

          if(e.key === "Enter"){
            commitEdit(
              member,
              input.value
            );
          }

          if(e.key === "Escape"){
            editingId = null;
            render();
          }

        };


      row.appendChild(avatar);
      row.appendChild(input);
      row.appendChild(saveBtn);
      row.appendChild(cancelBtn);

      listEl.appendChild(row);

      setTimeout(()=>{
        input.focus();
        input.select();
      },0);

      return;
    }


    /* ===== NORMAL MEMBER ===== */

    const avatar =
      document.createElement("div");

    avatar.className =
      "member-avatar";

    avatar.textContent =
      getInitials(member.name);


    const nameWrap =
      document.createElement("div");

    nameWrap.className =
      "name";


    const nameText =
      document.createElement("div");

    nameText.textContent =
      member.name;

    nameWrap.appendChild(nameText);


    if(member.galli || member.room_no){

      const meta =
        document.createElement("div");

      meta.className =
        "member-meta";


      if(member.galli){

        const galliBadge =
          document.createElement("span");

        galliBadge.className =
          "badge";

        galliBadge.textContent =
          "गल्ली " + member.galli;

        meta.appendChild(galliBadge);

      }


      if(member.room_no){

        const roomBadge =
          document.createElement("span");

        roomBadge.className =
          "badge-room";

        roomBadge.textContent =
          "रूम " + member.room_no;

        meta.appendChild(roomBadge);

      }

      nameWrap.appendChild(meta);

    }


    /* ===== SELECT ===== */

    const selectWrap =
      document.createElement("div");

    selectWrap.className =
      "select-wrap";


    const select =
      document.createElement("select");

    const options = [
      {v:"",l:"निवड नाही"},
      {v:"1",l:"गल्ली 1"},
      {v:"2",l:"गल्ली 2"},
      {v:"3",l:"गल्ली 3"},
      {v:"4",l:"गल्ली 4"}
    ];


    options.forEach(o=>{

      const opt =
        document.createElement("option");

      opt.value =
        o.v;

      opt.textContent =
        o.l;

      if(
        (member.galli || "") === o.v
      ){
        opt.selected = true;
      }

      select.appendChild(opt);

    });


    select.onchange =
      async(e)=>{
        await updateGalli(
          member,
          e.target.value || null
        );
      };


    selectWrap.appendChild(select);


    /* ===== ROOM ===== */

    const roomInput =
      document.createElement("input");

    roomInput.className =
      "room-input";

    roomInput.type =
      "text";

    roomInput.placeholder =
      "रूम नं.";

    roomInput.value =
      member.room_no || "";


    roomInput.onblur =
      (e)=>{

        const val =
          e.target.value.trim();

        if(
          val !==
          (member.room_no || "")
        ){

          updateRoom(
            member,
            val || null
          );

        }

      };


    roomInput.onkeydown =
      (e)=>{

        if(e.key === "Enter"){
          e.target.blur();
        }

      };


    selectWrap.appendChild(roomInput);


    /* ===== EDIT ===== */

    const editBtn =
      document.createElement("button");

    editBtn.className =
      "icon-btn";

    editBtn.title =
      "नाम बदलें";

    editBtn.textContent =
      "✎";

    editBtn.onclick =
      ()=>{
        editingId = member.id;
        render();
      };


    /* ===== DELETE ===== */

    const delBtn =
      document.createElement("button");

    delBtn.className =
      "icon-btn danger";

    delBtn.title =
      "हटाएं";

    delBtn.textContent =
      "🗑";

    delBtn.onclick =
      ()=>deleteMember(member);


    row.appendChild(avatar);
    row.appendChild(nameWrap);
    row.appendChild(selectWrap);
    row.appendChild(editBtn);
    row.appendChild(delBtn);

    listEl.appendChild(row);

  });


  /* ===== ADD MEMBER ===== */

  if(!searchQuery){

    const addRow =
      document.createElement("div");

    addRow.className =
      "add-row";


    const addInput =
      document.createElement("input");

    addInput.placeholder =
      "नया सदस्य नाम लिखें...";

    addInput.id =
      "newMemberInput";


    const addBtn =
      document.createElement("button");

    addBtn.className =
      "add-btn";

    addBtn.textContent =
      "+ सदस्य जोड़ें";

    addBtn.onclick =
      addMember;


    addInput.onkeydown =
      (e)=>{
        if(e.key === "Enter"){
          addMember();
        }
      };


    addRow.appendChild(addInput);
    addRow.appendChild(addBtn);

    listEl.appendChild(addRow);

  }

}


/* ================= UPDATE GALLI ================= */

async function updateGalli(member,galli){

  if(!sb) return;

  try{

    const {error} = await sb
      .from("galli_members")
      .update({galli})
      .eq("id",member.id);

    if(error) throw error;

    member.galli = galli;

    showSaved();

    render();

  }catch(e){

    alert(
      "अपडेट नहीं हो सका: " +
      (e.message || e)
    );

  }

}


/* ================= UPDATE ROOM ================= */

async function updateRoom(member,room_no){

  if(!sb) return;

  try{

    const {error} = await sb
      .from("galli_members")
      .update({room_no})
      .eq("id",member.id);

    if(error) throw error;

    member.room_no = room_no;

    showSaved();

    render();

  }catch(e){

    alert(
      "रूम नंबर सेव नहीं हो सका: " +
      (e.message || e)
    );

  }

}


/* ================= EDIT MEMBER ================= */

async function commitEdit(
  member,
  newNameRaw
){

  const newName =
    newNameRaw.trim();

  if(!newName){

    editingId = null;

    render();

    return;

  }


  if(
    newName !== member.name &&
    MEMBERS.some(
      m=>m.name === newName
    )
  ){

    alert(
      "यह नाम पहले से सूची में है।"
    );

    return;

  }


  try{

    const {error} = await sb
      .from("galli_members")
      .update({name:newName})
      .eq("id",member.id);

    if(error) throw error;

    member.name = newName;

    editingId = null;

    showSaved();

    render();

  }catch(e){

    alert(
      "नाम बदला नहीं जा सका: " +
      (e.message || e)
    );

  }

}


/* ================= DELETE ================= */

async function deleteMember(member){

  if(
    !confirm(
      `"${member.name}" को सूची से हटाएं?`
    )
  ){
    return;
  }

  try{

    const {error} = await sb
      .from("galli_members")
      .delete()
      .eq("id",member.id);

    if(error) throw error;

    MEMBERS =
      MEMBERS.filter(
        m=>m.id !== member.id
      );

    showSaved();

    render();

  }catch(e){

    alert(
      "हटाया नहीं जा सका: " +
      (e.message || e)
    );

  }

}


/* ================= ADD MEMBER ================= */

async function addMember(){

  const input =
    document.getElementById(
      "newMemberInput"
    );

  if(!input) return;

  const name =
    input.value.trim();

  if(!name) return;


  if(
    MEMBERS.some(
      m=>m.name === name
    )
  ){

    alert(
      "यह नाम पहले से सूची में है।"
    );

    return;

  }


  try{

    const {data,error} = await sb
      .from("galli_members")
      .insert({
        name,
        galli:null,
        room_no:null
      })
      .select()
      .single();

    if(error) throw error;

    MEMBERS.push(data);

    showSaved();

    render();


    const newInput =
      document.getElementById(
        "newMemberInput"
      );

    if(newInput){
      newInput.focus();
    }

  }catch(e){

    alert(
      "सदस्य जोड़ा नहीं जा सका: " +
      (e.message || e)
    );

  }

}


/* ================= MAIN RENDER ================= */

function render(){

  renderStats();

  renderTabs();

  renderList();

}


/* ================= EXCEL EXPORT ================= */

function exportToExcel(){

  if(typeof XLSX === "undefined"){

    alert(
      "Excel लाइब्रेरी लोड नहीं हो पाई।"
    );

    return;

  }


  const wb =
    XLSX.utils.book_new();


  const summaryRows = [
    ["क्र.","नाम","गल्ली","रूम नं."]
  ];


  const sortedMembers =
    [...MEMBERS].sort((a,b)=>{

      const ga = a.galli || "9";
      const gb = b.galli || "9";

      if(ga !== gb){
        return ga.localeCompare(gb);
      }

      return a.name.localeCompare(
        b.name,
        "hi"
      );

    });


  sortedMembers.forEach((m,i)=>{

    summaryRows.push([
      i+1,
      m.name,
      m.galli
        ? "गल्ली " + m.galli
        : "निवड नाही",
      m.room_no || ""
    ]);

  });


  const summarySheet =
    XLSX.utils.aoa_to_sheet(
      summaryRows
    );

  summarySheet["!cols"] = [
    {wch:6},
    {wch:35},
    {wch:14},
    {wch:10}
  ];

  XLSX.utils.book_append_sheet(
    wb,
    summarySheet,
    "सर्व सदस्य"
  );


  for(let g=1;g<=4;g++){

    const gStr =
      String(g);

    const names =
      sortByRoom(
        MEMBERS.filter(
          m=>m.galli === gStr
        )
      );


    const rows = [
      ["क्र.","नाम","रूम नं."]
    ];


    names.forEach((m,i)=>{

      rows.push([
        i+1,
        m.name,
        m.room_no || ""
      ]);

    });


    if(rows.length === 1){

      rows.push([
        "-",
        "(कोई सदस्य नहीं)",
        ""
      ]);

    }


    const sheet =
      XLSX.utils.aoa_to_sheet(
        rows
      );

    sheet["!cols"] = [
      {wch:6},
      {wch:35},
      {wch:10}
    ];


    XLSX.utils.book_append_sheet(
      wb,
      sheet,
      "गल्ली " + g
    );

  }


  const unassigned =
    MEMBERS.filter(
      m=>!m.galli
    );


  const uRows = [
    ["क्र.","नाम"]
  ];


  unassigned.forEach((m,i)=>{

    uRows.push([
      i+1,
      m.name
    ]);

  });


  if(uRows.length === 1){

    uRows.push([
      "-",
      "(कोई सदस्य नहीं)"
    ]);

  }


  const uSheet =
    XLSX.utils.aoa_to_sheet(
      uRows
    );

  uSheet["!cols"] = [
    {wch:6},
    {wch:35}
  ];


  XLSX.utils.book_append_sheet(
    wb,
    uSheet,
    "निवड नाही"
  );


  const cRows = [
    ["क्र.","नाम","पद"]
  ];


  COMMITTEE.forEach((p,i)=>{

    cRows.push([
      i+1,
      p.name,
      p.role
    ]);

  });


  const cSheet =
    XLSX.utils.aoa_to_sheet(
      cRows
    );

  cSheet["!cols"] = [
    {wch:6},
    {wch:30},
    {wch:16}
  ];


  XLSX.utils.book_append_sheet(
    wb,
    cSheet,
    "समिती"
  );


  XLSX.writeFile(
    wb,
    "galli_members.xlsx"
  );

}


/* ================= POSTER ================= */

function escHtml(s){

  const div =
    document.createElement("div");

  div.textContent = s;

  return div.innerHTML;

}


function buildPosterHTML(){

  const galliLists = {
    1:[],
    2:[],
    3:[],
    4:[]
  };


  MEMBERS.forEach(m=>{

    if(
      m.galli &&
      galliLists[m.galli]
    ){
      galliLists[m.galli].push(m);
    }

  });


  Object.keys(galliLists).forEach(g=>{

    galliLists[g] =
      sortByRoom(
        galliLists[g]
      );

  });


  const totalMembers =
    galliLists[1].length +
    galliLists[2].length +
    galliLists[3].length +
    galliLists[4].length;


  function namesFor(role){

    return COMMITTEE
      .filter(c=>c.role === role)
      .map(c=>c.name);

  }


  const adhyaksh =
    namesFor("अध्यक्ष");

  const upadhyaksh =
    namesFor("उपाध्यक्ष");

  const sachiv =
    namesFor("सचिव");

  const upsachiv =
    namesFor("उपसचिव");

  const khajindar =
    namesFor("खजिनदार");

  const upkhaj =
    namesFor("उपखजिनदार");

  const sadasya =
    namesFor("सदस्य");


  function chip(
    role,
    name,
    cls
  ){

    return `
      <div class="p-chip ${cls}">
        <div class="p-chip-role">
          ${escHtml(role)}
        </div>

        <div class="p-chip-name">
          श्री. ${escHtml(name)}
        </div>
      </div>
    `;

  }


  let chipsHtml = "";


  adhyaksh.forEach(n=>
    chipsHtml += chip(
      "अध्यक्ष",
      n,
      "p-chip-gold"
    )
  );


  upadhyaksh.forEach(n=>
    chipsHtml += chip(
      "उपाध्यक्ष",
      n,
      "p-chip-maroon"
    )
  );


  sachiv.forEach(n=>
    chipsHtml += chip(
      "सचिव",
      n,
      "p-chip-maroon"
    )
  );


  upsachiv.forEach(n=>
    chipsHtml += chip(
      "उपसचिव",
      n,
      "p-chip-purple"
    )
  );


  khajindar.forEach(n=>
    chipsHtml += chip(
      "खजिनदार",
      n,
      "p-chip-gold"
    )
  );


  upkhaj.forEach(n=>
    chipsHtml += chip(
      "उपखजिनदार",
      n,
      "p-chip-purple"
    )
  );


  const advisorChips =
    sadasya.map(n=>`
      <div class="p-advisor-chip">
        श्री. ${escHtml(n)}
      </div>
    `).join("");


  const galliColors = [
    ["#8e24aa","#f3e5f5"],
    ["#d84315","#fff3e0"],
    ["#00695c","#e0f2f1"],
    ["#ad1457","#fce4ec"]
  ];


  /*
    IMPORTANT:
    Room number has been completely removed
    from poster generation.
  */

  function galliCard(
    num,
    title,
    members,
    accent,
    bgTint
  ){

    let items = "";


    members.forEach((m,i)=>{

      items += `
        <div class="p-member-row">

          <span
            class="p-member-idx"
            style="background:${accent};"
          >
            ${i+1}
          </span>

          <span class="p-member-name">
            ${escHtml(m.name)}
          </span>

        </div>
      `;

    });


    return `
      <div class="p-galli-card">

        <div
          class="p-galli-card-header"
          style="
            background:
            linear-gradient(
              135deg,
              ${accent},
              ${accent}cc
            );
          "
        >

          <span class="p-galli-card-title">
            ${escHtml(title)}
          </span>

          <span class="p-galli-card-count">
            ${members.length} सदस्य
          </span>

        </div>

        <div
          class="p-galli-card-body"
          style="background:${bgTint};"
        >

          ${items}

        </div>

      </div>
    `;

  }


  const galliCardsHtml =

    galliCard(
      1,
      "गल्ली क्रमांक १",
      galliLists[1],
      galliColors[0][0],
      galliColors[0][1]
    )

    +

    galliCard(
      2,
      "गल्ली क्रमांक २",
      galliLists[2],
      galliColors[1][0],
      galliColors[1][1]
    )

    +

    galliCard(
      3,
      "गल्ली क्रमांक ३",
      galliLists[3],
      galliColors[2][0],
      galliColors[2][1]
    )

    +

    galliCard(
      4,
      "गल्ली क्रमांक ४",
      galliLists[4],
      galliColors[3][0],
      galliColors[3][1]
    );


  return `

    <div class="p-body">

      <div class="p-header">

        <div class="p-eyebrow">
          ॥ श्री गणेशाय नमः ॥
        </div>

        </div>

        <div class="p-sub-title">

        </div>

      </div>

      <div class="p-scallop"></div>


      <div class="p-committee-section">

        <div class="p-section-heading">

          <div class="p-line"></div>

          <div class="p-label">
            पदाधिकारी समिती
          </div>

          <div class="p-line"></div>

        </div>


        <div class="p-chip-wrap">
          ${chipsHtml}
        </div>


        <div class="p-advisor-panel">

          <span class="p-advisor-label">
            सदस्य (सल्लागार):
          </span>

          ${advisorChips}

        </div>

      </div>


      <div class="p-galli-section">

        <div class="p-section-heading">

          <div class="p-line"></div>

          <div class="p-label">
            गल्लीनुसार सभासद यादी
          </div>

          <div class="p-line"></div>

        </div>


        <div class="p-galli-grid">

          ${galliCardsHtml}

        </div>

      </div>


      <div class="p-footer">

        एकूण सभासद संख्या:

        <span class="p-count">
          ${totalMembers}
        </span>

      </div>

    </div>

  `;

}

/* ================= GENERATE POSTER ================= */

async function generatePoster(){

const btn =
document.getElementById(
"posterBtn"
);

const originalText =
btn.textContent;

btn.disabled = true;

btn.textContent =
"⏳ बन रहा है...";

try{

```
if(
  !document.getElementById(
    "posterStyleTag"
  )
){

  document.head.insertAdjacentHTML(
    "beforeend",
    POSTER_STYLE
  );

}


const root =
  document.getElementById(
    "posterRoot"
  );


root.innerHTML =
  buildPosterHTML();


await new Promise(
  r=>setTimeout(r,400)
);


const canvas =
  await html2canvas(
    root,
    {
      backgroundColor:"#fdf6ec",
      scale:2,
      useCORS:true,
      width:1700,
      windowWidth:1700
    }
  );


const dataUrl =
  canvas.toDataURL(
    "image/png"
  );


const link =
  document.createElement("a");


const dateStr =
  new Date()
    .toISOString()
    .slice(0,10);


link.download =
  `mangalmurti_poster_${dateStr}.png`;

link.href =
  dataUrl;


document.body.appendChild(link);

link.click();

document.body.removeChild(link);


root.innerHTML = "";
```

}catch(e){

```
console.error(
  "Poster generation failed",
  e
);

alert(
  "पोस्टर नहीं बन सका: " +
  (e.message || e)
);
```

}finally{

```
btn.disabled = false;

btn.textContent =
  originalText;
```

}

}

render();

</script>
