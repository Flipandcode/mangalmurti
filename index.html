<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mangal Murti Member Manager</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2f6f4f">
<link rel="icon" href="/icon-192.png">

<!-- iOS "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Galli Manager">
<link rel="apple-touch-icon" href="/icon-192.png">

<!-- Devanagari web font, used for crisp poster rendering -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&family=Noto+Sans+Devanagari:wght@500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#faf8f5;
    --panel:#ffffff;
    --ink:#232323;
    --muted:#7a7a7a;
    --line:#e6e1d8;
    --accent:#2f6f4f;
    --accent-soft:#e8f2ec;
    --tab-bg:#efece5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans', 'Segoe UI', Arial, sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:20px;
  }
  h1{
    font-size:20px;
    margin:0 0 4px;
    font-weight:700;
  }
  .sub{
    color:var(--muted);
    font-size:13px;
    margin-bottom:18px;
  }
  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:16px;
    border-bottom:1px solid var(--line);
    padding-bottom:10px;
  }
  .tab-btn{
    border:1px solid var(--line);
    background:var(--tab-bg);
    color:var(--ink);
    padding:8px 14px;
    border-radius:8px;
    font-size:14px;
    cursor:pointer;
    font-weight:600;
    transition:all .15s;
  }
  .tab-btn:hover{ background:#e2ddd0; }
  .tab-btn.active{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  .count{
    font-weight:400;
    opacity:.85;
    margin-left:4px;
    font-size:12px;
  }
  .list{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:11px 14px;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .row:last-child{ border-bottom:none; }
  .row:nth-child(even){ background:#fbfaf7; }
  .name{
    flex:1;
    min-width:0;
    word-break:break-word;
  }
  .badge{
    font-size:11px;
    background:var(--accent-soft);
    color:var(--accent);
    padding:2px 8px;
    border-radius:20px;
    margin-left:8px;
    font-weight:600;
    white-space:nowrap;
  }
  .select-wrap{
    display:flex;
    gap:4px;
    flex-shrink:0;
    align-items:center;
  }
  select{
    font-size:13px;
    padding:6px 8px;
    border-radius:6px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
  }
  .room-input{
    width:64px;
    font-size:13px;
    padding:6px 6px;
    border-radius:6px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    text-align:center;
  }
  .room-input::placeholder{ color:#b8b2a5; }
  .empty{
    padding:30px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
  }
  .top-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
  }
  .status{
    font-size:12px;
    color:var(--muted);
  }
  .save-indicator{
    font-size:12px;
    color:var(--accent);
    opacity:0;
    transition:opacity .3s;
  }
  .save-indicator.show{ opacity:1; }
  .export-btn{
    border:none;
    background:var(--accent);
    color:#fff;
    padding:10px 16px;
    border-radius:8px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .export-btn:hover{ background:#265d41; }
  .export-btn:disabled{
    background:#b9b9b9;
    cursor:not-allowed;
  }
  .poster-btn{
    border:none;
    background:#e65100;
    color:#fff;
    padding:10px 16px;
    border-radius:8px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .poster-btn:hover{ background:#c64600; }
  .poster-btn:disabled{
    background:#b9b9b9;
    cursor:not-allowed;
  }
  .header-actions{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .icon-btn{
    border:1px solid var(--line);
    background:#fff;
    color:var(--muted);
    width:30px;
    height:30px;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .icon-btn:hover{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }
  .icon-btn.danger:hover{ background:#fbe9e7; color:#c0392b; border-color:#c0392b; }
  .name-input{
    flex:1;
    font-size:14px;
    padding:6px 8px;
    border-radius:6px;
    border:1px solid var(--accent);
    font-family:inherit;
  }
  .add-row{
    display:flex;
    gap:8px;
    padding:12px 14px;
    background:#fbfaf7;
    border-top:1px solid var(--line);
  }
  .add-row input{
    flex:1;
    font-size:14px;
    padding:8px 10px;
    border-radius:6px;
    border:1px solid var(--line);
    font-family:inherit;
  }
  .add-btn{
    border:none;
    background:var(--accent);
    color:#fff;
    padding:8px 16px;
    border-radius:6px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
  }
  .add-btn:hover{ background:#265d41; }
  .conn-ok{ color:var(--accent); }
  .conn-bad{ color:#c0392b; }
</style>
</head>
<body>

<div class="top-row">
  <div>
    <h1>Mangal Murti Chawl सदस्य व्यवस्थापन</h1>
    <div class="sub">प्रत्येक सदस्य के आगे से Galli और रूम नंबर चुनें। ऊपर के टैब से सूची देखें। <span id="connStatus"></span></div>
  </div>
  <div class="header-actions">
    <div class="save-indicator" id="saveIndicator">✓ Saved</div>
    <button class="poster-btn" id="posterBtn" onclick="generatePoster()">🖼 पोस्टर बनाएं</button>
    <button class="export-btn" id="exportBtn" onclick="exportToExcel()">⬇ Excel में निर्यात करें</button>
  </div>
</div>

<div class="tabs" id="tabs"></div>
<div class="list" id="list"></div>

<!-- Hidden off-screen container used to render the poster before capturing it as an image -->
<div id="posterRoot" style="position:absolute; left:-99999px; top:0; width:1700px;"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ====== SUPABASE CONFIG ======
const SUPABASE_URL = "https://dtgwxfibkurjbgutlcxw.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_y6lWbqtfNnuiDijfWxeCTw_eyAcPwZG";
// ==============================================

let sb = null;
let MEMBERS = []; // array of {id, name, galli, room_no}
let currentTab = "unassigned";
let editingId = null; // id of member currently being edited

const TABS = [
  {id:"unassigned", label:"निवड नाही"},
  {id:"all", label:"सर्व"},
  {id:"1", label:"गल्ली 1"},
  {id:"2", label:"गल्ली 2"},
  {id:"3", label:"गल्ली 3"},
  {id:"4", label:"गल्ली 4"},
  {id:"committee", label:"समिती"}
];

const COMMITTEE = [
  {name:"सतीश नलावडे", role:"अध्यक्ष"},
  {name:"निलेश शिंदे", role:"उपाध्यक्ष"},
  {name:"सूरज विनोद तिवारी", role:"उपाध्यक्ष"},
  {name:"राहुल साहेबराव पाटील", role:"सचिव"},
  {name:"महेंद्र वाडेकर", role:"उपसचिव"},
  {name:"राकेश बागल", role:"खजिनदार"},
  {name:"राकेश जानवळकर", role:"उपखजिनदार"},
  {name:"बलेंद्र सिंह", role:"सदस्य"},
  {name:"निराज पांडेय", role:"सदस्य"},
  {name:"धर्मेश ईश्वरप्रसाद मिश्र", role:"सदस्य"}
];

function setConnStatus(ok, msg){
  const el = document.getElementById('connStatus');
  el.className = ok ? 'conn-ok' : 'conn-bad';
  el.textContent = msg;
}

function showSaved(){
  const ind = document.getElementById('saveIndicator');
  ind.classList.add('show');
  setTimeout(()=>ind.classList.remove('show'), 900);
}

async function init(){
  if(!SUPABASE_URL.startsWith('http') || SUPABASE_ANON_KEY === "YOUR_SUPABASE_ANON_KEY"){
    setConnStatus(false, '⚠ Supabase कॉन्फ़िगर नहीं है — कोड में SUPABASE_URL और SUPABASE_ANON_KEY भरें');
    render();
    return;
  }
  if(typeof window.supabase === 'undefined'){
    setConnStatus(false, '⚠ Supabase लाइब्रेरी लोड नहीं हो पाई (CDN ब्लॉक हो सकता है)');
    render();
    return;
  }
  try{
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }catch(e){
    console.error(e);
    setConnStatus(false, '⚠ कनेक्शन शुरू नहीं हो सका: ' + (e.message || e));
    render();
    return;
  }
  await loadMembers();
  try{
    subscribeRealtime();
  }catch(e){
    console.error('Realtime subscribe failed', e);
  }
}

async function loadMembers(){
  try{
    const { data, error } = await sb
      .from('galli_members')
      .select('id, name, galli, room_no')
      .order('created_at', { ascending: true });
    if(error) throw error;
    MEMBERS = data || [];
    setConnStatus(true, '● लाइव सिंक चालू');
  }catch(e){
    console.error(e);
    setConnStatus(false, '⚠ डेटा लोड नहीं हो सका: ' + (e.message || e));
  }
  render();
}

function subscribeRealtime(){
  sb
    .channel('galli_members_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'galli_members' }, () => {
      loadMembers();
    })
    .subscribe();
}

function countFor(tabId){
  if(tabId === "all") return MEMBERS.length;
  if(tabId === "unassigned") return MEMBERS.filter(m => !m.galli).length;
  if(tabId === "committee") return COMMITTEE.length;
  return MEMBERS.filter(m => m.galli === tabId).length;
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = "";
  TABS.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (currentTab === t.id ? ' active' : '');
    btn.innerHTML = `${t.label}<span class="count">(${countFor(t.id)})</span>`;
    btn.onclick = () => { currentTab = t.id; render(); };
    tabsEl.appendChild(btn);
  });
}

// Sort helper: ascending by room number. Numeric-aware, blanks go last.
function sortByRoom(members){
  return [...members].sort((a,b) => {
    const ra = (a.room_no || '').toString().trim();
    const rb = (b.room_no || '').toString().trim();
    if(!ra && !rb) return 0;
    if(!ra) return 1;
    if(!rb) return -1;
    const na = parseFloat(ra), nb = parseFloat(rb);
    if(!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
    return ra.localeCompare(rb, 'hi', {numeric:true});
  });
}

function renderList(){
  const listEl = document.getElementById('list');

  if(currentTab === "committee"){
    listEl.innerHTML = "";
    COMMITTEE.forEach(person => {
      const row = document.createElement('div');
      row.className = 'row';

      const nameEl = document.createElement('div');
      nameEl.className = 'name';
      nameEl.textContent = person.name;
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = person.role;
      nameEl.appendChild(badge);

      row.appendChild(nameEl);
      listEl.appendChild(row);
    });
    return;
  }

  let members;
  if(currentTab === "all") members = MEMBERS;
  else if(currentTab === "unassigned") members = MEMBERS.filter(m => !m.galli);
  else members = MEMBERS.filter(m => m.galli === currentTab);

  // Sort ascending by room number when viewing a specific galli tab
  if(["1","2","3","4"].includes(currentTab)){
    members = sortByRoom(members);
  }

  listEl.innerHTML = "";

  if(members.length === 0){
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'इस टैब में कोई सदस्य नहीं है';
    listEl.appendChild(empty);
  }

  members.forEach(member => {
    const row = document.createElement('div');
    row.className = 'row';

    if(editingId === member.id){
      const input = document.createElement('input');
      input.className = 'name-input';
      input.value = member.name;
      row.appendChild(input);

      const saveBtn = document.createElement('button');
      saveBtn.className = 'icon-btn';
      saveBtn.title = 'सेव करें';
      saveBtn.textContent = '✓';
      saveBtn.onclick = () => commitEdit(member, input.value);
      row.appendChild(saveBtn);

      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'icon-btn';
      cancelBtn.title = 'रद्द करें';
      cancelBtn.textContent = '✕';
      cancelBtn.onclick = () => { editingId = null; render(); };
      row.appendChild(cancelBtn);

      input.onkeydown = (e) => {
        if(e.key === 'Enter') commitEdit(member, input.value);
        if(e.key === 'Escape'){ editingId = null; render(); }
      };
      listEl.appendChild(row);
      input.focus();
      input.select();
      return;
    }

    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = member.name;
    if(member.galli){
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = 'गल्ली ' + member.galli + (member.room_no ? ' · रूम ' + member.room_no : '');
      nameEl.appendChild(badge);
    }

    const selectWrap = document.createElement('div');
    selectWrap.className = 'select-wrap';

    const select = document.createElement('select');
    const options = [
      {v:"", l:"निवड नाही"},
      {v:"1", l:"गल्ली 1"},
      {v:"2", l:"गल्ली 2"},
      {v:"3", l:"गल्ली 3"},
      {v:"4", l:"गल्ली 4"}
    ];
    options.forEach(o => {
      const opt = document.createElement('option');
      opt.value = o.v;
      opt.textContent = o.l;
      if((member.galli || "") === o.v) opt.selected = true;
      select.appendChild(opt);
    });
    select.onchange = async (e) => {
      await updateGalli(member, e.target.value || null);
    };
    selectWrap.appendChild(select);

    const roomInput = document.createElement('input');
    roomInput.className = 'room-input';
    roomInput.type = 'text';
    roomInput.placeholder = 'रूम नं.';
    roomInput.value = member.room_no || '';
    roomInput.onblur = (e) => {
      const val = e.target.value.trim();
      if(val !== (member.room_no || '')) updateRoom(member, val || null);
    };
    roomInput.onkeydown = (e) => {
      if(e.key === 'Enter') e.target.blur();
    };
    selectWrap.appendChild(roomInput);

    const editBtn = document.createElement('button');
    editBtn.className = 'icon-btn';
    editBtn.title = 'नाम बदलें';
    editBtn.textContent = '✎';
    editBtn.onclick = () => { editingId = member.id; render(); };

    const delBtn = document.createElement('button');
    delBtn.className = 'icon-btn danger';
    delBtn.title = 'हटाएं';
    delBtn.textContent = '🗑';
    delBtn.onclick = () => deleteMember(member);

    row.appendChild(nameEl);
    row.appendChild(selectWrap);
    row.appendChild(editBtn);
    row.appendChild(delBtn);
    listEl.appendChild(row);
  });

  const addRow = document.createElement('div');
  addRow.className = 'add-row';
  const addInput = document.createElement('input');
  addInput.placeholder = 'नया सदस्य नाम लिखें...';
  addInput.id = 'newMemberInput';
  const addBtn = document.createElement('button');
  addBtn.className = 'add-btn';
  addBtn.textContent = '+ सदस्य जोड़ें';
  addBtn.onclick = addMember;
  addInput.onkeydown = (e) => { if(e.key === 'Enter') addMember(); };
  addRow.appendChild(addInput);
  addRow.appendChild(addBtn);
  listEl.appendChild(addRow);
}

async function updateGalli(member, galli){
  if(!sb) return;
  try{
    const { error } = await sb
      .from('galli_members')
      .update({ galli })
      .eq('id', member.id);
    if(error) throw error;
    member.galli = galli;
    showSaved();
    render();
  }catch(e){
    alert('अपडेट नहीं हो सका: ' + (e.message || e));
  }
}

async function updateRoom(member, room_no){
  if(!sb) return;
  try{
    const { error } = await sb
      .from('galli_members')
      .update({ room_no })
      .eq('id', member.id);
    if(error) throw error;
    member.room_no = room_no;
    showSaved();
    render();
  }catch(e){
    alert('रूम नंबर सेव नहीं हो सका: ' + (e.message || e));
  }
}

async function commitEdit(member, newNameRaw){
  const newName = newNameRaw.trim();
  if(!newName){ editingId = null; render(); return; }
  if(newName !== member.name && MEMBERS.some(m => m.name === newName)){
    alert('यह नाम पहले से सूची में है।');
    return;
  }
  try{
    const { error } = await sb
      .from('galli_members')
      .update({ name: newName })
      .eq('id', member.id);
    if(error) throw error;
    member.name = newName;
    editingId = null;
    showSaved();
    render();
  }catch(e){
    alert('नाम बदला नहीं जा सका: ' + (e.message || e));
  }
}

async function deleteMember(member){
  if(!confirm(`"${member.name}" को सूची से हटाएं?`)) return;
  try{
    const { error } = await sb
      .from('galli_members')
      .delete()
      .eq('id', member.id);
    if(error) throw error;
    MEMBERS = MEMBERS.filter(m => m.id !== member.id);
    showSaved();
    render();
  }catch(e){
    alert('हटाया नहीं जा सका: ' + (e.message || e));
  }
}

async function addMember(){
  const input = document.getElementById('newMemberInput');
  const name = input.value.trim();
  if(!name) return;
  if(MEMBERS.some(m => m.name === name)){
    alert('यह नाम पहले से सूची में है।');
    return;
  }
  try{
    const { data, error } = await sb
      .from('galli_members')
      .insert({ name, galli: null, room_no: null })
      .select()
      .single();
    if(error) throw error;
    MEMBERS.push(data);
    showSaved();
    render();
    const newInput = document.getElementById('newMemberInput');
    if(newInput) newInput.focus();
  }catch(e){
    alert('सदस्य जोड़ा नहीं जा सका: ' + (e.message || e));
  }
}

function render(){
  renderTabs();
  renderList();
}

function exportToExcel(){
  if(typeof XLSX === 'undefined'){
    alert("Excel लाइब्रेरी लोड नहीं हो पाई। कृपया इंटरनेट कनेक्शन जांचें और पुनः प्रयास करें।");
    return;
  }

  const wb = XLSX.utils.book_new();

  const summaryRows = [["क्र.", "नाम", "गल्ली", "रूम नं."]];
  const sortedMembers = [...MEMBERS].sort((a,b) => {
    const ga = a.galli || "9";
    const gb = b.galli || "9";
    if(ga !== gb) return ga.localeCompare(gb);
    return a.name.localeCompare(b.name, 'hi');
  });
  sortedMembers.forEach((m, i) => {
    summaryRows.push([i+1, m.name, m.galli ? ("गल्ली " + m.galli) : "निवड नाही", m.room_no || ""]);
  });
  const summarySheet = XLSX.utils.aoa_to_sheet(summaryRows);
  summarySheet['!cols'] = [{wch:6},{wch:35},{wch:14},{wch:10}];
  XLSX.utils.book_append_sheet(wb, summarySheet, "सर्व सदस्य");

  for(let g = 1; g <= 4; g++){
    const gStr = String(g);
    const names = sortByRoom(MEMBERS.filter(m => m.galli === gStr));
    const rows = [["क्र.", "नाम", "रूम नं."]];
    names.forEach((m, i) => rows.push([i+1, m.name, m.room_no || ""]));
    if(rows.length === 1) rows.push(["-", "(कोई सदस्य नहीं)", ""]);
    const sheet = XLSX.utils.aoa_to_sheet(rows);
    sheet['!cols'] = [{wch:6},{wch:35},{wch:10}];
    XLSX.utils.book_append_sheet(wb, sheet, "गल्ली " + g);
  }

  const unassigned = MEMBERS.filter(m => !m.galli);
  const uRows = [["क्र.", "नाम"]];
  unassigned.forEach((m, i) => uRows.push([i+1, m.name]));
  if(uRows.length === 1) uRows.push(["-", "(कोई सदस्य नहीं)"]);
  const uSheet = XLSX.utils.aoa_to_sheet(uRows);
  uSheet['!cols'] = [{wch:6},{wch:35}];
  XLSX.utils.book_append_sheet(wb, uSheet, "निवड नाही");

  // Committee sheet
  const cRows = [["क्र.", "नाम", "पद"]];
  COMMITTEE.forEach((p, i) => cRows.push([i+1, p.name, p.role]));
  const cSheet = XLSX.utils.aoa_to_sheet(cRows);
  cSheet['!cols'] = [{wch:6},{wch:30},{wch:16}];
  XLSX.utils.book_append_sheet(wb, cSheet, "समिती");

  XLSX.writeFile(wb, "galli_members.xlsx");
}

// ===================== POSTER GENERATION =====================

function escHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function buildPosterHTML(){
  const galliLists = {1:[], 2:[], 3:[], 4:[]};
  MEMBERS.forEach(m => {
    if(m.galli && galliLists[m.galli]) galliLists[m.galli].push(m);
  });
  Object.keys(galliLists).forEach(g => { galliLists[g] = sortByRoom(galliLists[g]); });

  const totalMembers = galliLists[1].length + galliLists[2].length + galliLists[3].length + galliLists[4].length;

  function namesFor(role){
    return COMMITTEE.filter(c => c.role === role).map(c => c.name);
  }
  const adhyaksh = namesFor('अध्यक्ष');
  const upadhyaksh = namesFor('उपाध्यक्ष');
  const sachiv = namesFor('सचिव');
  const upsachiv = namesFor('उपसचिव');
  const khajindar = namesFor('खजिनदार');
  const upkhaj = namesFor('उपखजिनदार');
  const sadasya = namesFor('सदस्य');

  function chip(role, name, cls){
    return `<div class="p-chip ${cls}">
        <div class="p-chip-role">${escHtml(role)}</div>
        <div class="p-chip-name">श्री. ${escHtml(name)}</div>
      </div>`;
  }

  let chipsHtml = "";
  adhyaksh.forEach(n => chipsHtml += chip("अध्यक्ष", n, "p-chip-gold"));
  upadhyaksh.forEach(n => chipsHtml += chip("उपाध्यक्ष", n, "p-chip-maroon"));
  sachiv.forEach(n => chipsHtml += chip("सचिव", n, "p-chip-maroon"));
  upsachiv.forEach(n => chipsHtml += chip("उपसचिव", n, "p-chip-purple"));
  khajindar.forEach(n => chipsHtml += chip("खजिनदार", n, "p-chip-gold"));
  upkhaj.forEach(n => chipsHtml += chip("उपखजिनदार", n, "p-chip-purple"));

  const advisorChips = sadasya.map(n => `<div class="p-advisor-chip">श्री. ${escHtml(n)}</div>`).join("");

  const galliColors = [
    ["#8e24aa", "#f3e5f5"],
    ["#d84315", "#fff3e0"],
    ["#00695c", "#e0f2f1"],
    ["#ad1457", "#fce4ec"]
  ];

  function galliCard(num, title, members, accent, bgTint){
    let items = "";
    members.forEach((m, i) => {
      const roomTxt = m.room_no ? ` <span class="p-room">(रूम ${escHtml(m.room_no)})</span>` : '';
      items += `<div class="p-member-row">
          <span class="p-member-idx" style="background:${accent};">${i+1}</span>
          <span class="p-member-name">${escHtml(m.name)}${roomTxt}</span>
        </div>`;
    });
    return `
      <div class="p-galli-card">
        <div class="p-galli-card-header" style="background:linear-gradient(135deg,${accent},${accent}cc);">
          <span class="p-galli-card-title">${escHtml(title)}</span>
          <span class="p-galli-card-count">${members.length} सदस्य</span>
        </div>
        <div class="p-galli-card-body" style="background:${bgTint};">
          ${items}
        </div>
      </div>`;
  }

  const galliCardsHtml =
    galliCard(1, "गल्ली क्रमांक १", galliLists[1], galliColors[0][0], galliColors[0][1]) +
    galliCard(2, "गल्ली क्रमांक २", galliLists[2], galliColors[1][0], galliColors[1][1]) +
    galliCard(3, "गल्ली क्रमांक ३", galliLists[3], galliColors[2][0], galliColors[2][1]) +
    galliCard(4, "गल्ली क्रमांक ४", galliLists[4], galliColors[3][0], galliColors[3][1]);

  return `
  <div class="p-body">
    <div class="p-header">
      <div class="p-eyebrow">॥ श्री गणेशाय नमः ॥</div>
      <div class="p-main-title">मंगलमुर्ती चाळ</div>
      <div class="p-sub-title">रहिवासी व पदाधिकारी सूची</div>
    </div>
    <div class="p-scallop"></div>

    <div class="p-committee-section">
      <div class="p-section-heading">
        <div class="p-line"></div>
        <div class="p-label">पदाधिकारी समिती</div>
        <div class="p-line"></div>
      </div>
      <div class="p-chip-wrap">${chipsHtml}</div>
      <div class="p-advisor-panel">
        <span class="p-advisor-label">सदस्य (सल्लागार):</span>
        ${advisorChips}
      </div>
    </div>

    <div class="p-galli-section">
      <div class="p-section-heading">
        <div class="p-line"></div>
        <div class="p-label">गल्लीनुसार सभासद यादी</div>
        <div class="p-line"></div>
      </div>
      <div class="p-galli-grid">${galliCardsHtml}</div>
    </div>

    <div class="p-footer">एकूण सभासद संख्या: <span class="p-count">${totalMembers}</span></div>
  </div>`;
}

async function generatePoster(){
  const btn = document.getElementById('posterBtn');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '⏳ बन रहा है...';

  try{
    // Inject poster-scoped styles once
    if(!document.getElementById('posterStyleTag')){
      document.head.insertAdjacentHTML('beforeend', POSTER_STYLE);
    }

    const root = document.getElementById('posterRoot');
    root.innerHTML = buildPosterHTML();

    // Give web fonts a moment to apply before capture
    await new Promise(r => setTimeout(r, 300));

    const canvas = await html2canvas(root, {
      backgroundColor: '#fdf6ec',
      scale: 2,
      useCORS: true,
      width: 1700,
      windowWidth: 1700
    });

    const dataUrl = canvas.toDataURL('image/png');
    const link = document.createElement('a');
    const dateStr = new Date().toISOString().slice(0,10);
    link.download = `mangalmurti_poster_${dateStr}.png`;
    link.href = dataUrl;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    root.innerHTML = ""; // clear hidden container
  }catch(e){
    console.error('Poster generation failed', e);
    alert('पोस्टर नहीं बन सका: ' + (e.message || e));
  }finally{
    btn.disabled = false;
    btn.textContent = originalText;
  }
}
